name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Code style & static analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: composer run lint

      - name: Run static analysis
        run: composer run analyse

  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.5, 8.4, 8.3]
        laravel: [13.*, 12.*]
        dependencies: [highest]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*
          - php: 8.3
            laravel: 12.*
            testbench: 10.*
            dependencies: lowest

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup problem matchers
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

      - name: Execute tests
        run: composer run test:ci

      - name: Upload code coverage
        uses: codecov/codecov-action@v7.1.1
        if: ${{ matrix.php == '8.5' && matrix.laravel == '13.*' }}
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
